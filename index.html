<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Fling a Thing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; position: fixed; }
        #player { width: 100vw; height: 100vh; display: block; }
    </style>
    <!-- Loads the standalone Ruffle Web Assembly engine directly into your app -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="player"></div>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            container.appendChild(player);
            
            // Streams the game binary layout through an open CORS proxy pipeline
            player.load({
                url: "https://allorigins.win" + encodeURIComponent("https://archive.org"),
                allowScriptAccess: true
            });
        });
    </script>
</body>
</html>
