<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fling a Thing</title>
    <!-- PWA Web App Manifest for Android / Chrome -->
    <link rel="manifest" href="data:application/json;base64,ewogICJubWUiOiAiRmxpbmcgYSBUaGluZyIsCiAgInNob3J0X25hbWUiOiAiRmxpbmciLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgIm9yaWVudGF0aW9uIjogInBvcnRyYWl0IiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMDAwMDAwIiwKICAidGhlbWVfY29sb3IiOiAiIzAwMDAwMCIKfQ==">
    <!-- iOS Meta Tags for Sonic 3 AIR style standalone web app feel -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fling a Thing">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        #ruffle {
            width: 100%;
            height: 100%;
        }
        /* Style adjustments for iOS safe area notches */
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }
    </style>
    <!-- Load Ruffle directly from unpkg CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="player-container">
        <div id="ruffle"></div>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle");
            container.appendChild(player);
            
            // Configuration optimized for a standalone native-app experience
            player.config = {
                autoplay: "on",
                unmuteOverlay: "hidden",
                letterbox: "on",
                warnOnUnsupportedContent: false
            };
            
            // Streaming the SWF directly from Internet Archive's public server pipeline
            player.load("https://archive.org/download/580854-suckies/Fling_a_Thing.swf");
        });
    </script>
</body>
</html>
